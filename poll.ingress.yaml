apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poll-ingress
  labels:
    app: poll
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx-example #traefik here ?
  rules:
  - http:
      paths:
      - path: /testpath # "A list of paths, each of which has an associated
#backend defined with a service.name and a service.port.name or
# service.port.number. Both the host and path must match the content of an
# incoming request before the load balancer directs traffic to the referenced
#Service."
        pathType: Prefix
        backend:
          service:
            name: test
            port:
              number: 80