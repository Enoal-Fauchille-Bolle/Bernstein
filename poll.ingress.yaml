apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poll-ingress
  labels:
    app: poll
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: poll.dop.io
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: poll-service
                port:
                  number: 80
