name: kuttl-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kuttl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up KUTTL
        run: |
          wget -O kuttl -q https://github.com/kudobuilder/kuttl/releases/download/v0.22.0/kubectl-kuttl_0.22.0_linux_x86_64
          chmod +x kuttl
          ./kuttl version

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Run KUTTL tests
        run: |
          ./kuttl test --config tests/kuttl-test.yaml
