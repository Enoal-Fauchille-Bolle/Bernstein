---
name: Chocolatine

"on":
  push:
    branches:
      - "*"
      - "!**ga-ignore-*"
  pull_request:
    branches:
      - "*"
      - "!**ga-ignore-*"

env:
  MIRROR_URL: git@github.com:EpitechPGE3-2025/G-DOP-500-NAN-5-1-bernstein-5.git

jobs:
  yamllint:
    name: Check Lint
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.full_name != 'EpitechPGE3-2025/G-DOP-500-NAN-5-1-bernstein-5' }}
    steps:
      - name: Checking Out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint . -c yamllint.yaml

  kubeconform:
    name: Check Kubernetes Manifests
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.full_name != 'EpitechPGE3-2025/G-DOP-500-NAN-5-1-bernstein-5' }}
    steps:
      - name: Checking Out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/\
          v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform
      - name: Validate YAML files
        run: |
          ./kubeconform -ignore-filename-pattern "yamllint.yaml" *.yaml

  repository_mirroring:
    name: Repository Mirroring
    runs-on: ubuntu-latest
    needs: [yamllint, kubeconform]
    if: ${{ github.event.repository.full_name != 'EpitechPGE3-2025/G-DOP-500-NAN-5-1-bernstein-5' }}
    steps:
      - name: Checking Out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirroring
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }} # valid-secret
